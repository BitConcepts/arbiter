sample:
  name: arbiter Embedded Firewall
  description: >
    Stateful packet filtering engine. arbiter reasons about blocklists,
    established connections, SYN flood detection (computed score),
    port-based rules, ICMP rate limiting, DPI anomalies, and default
    deny. Imports ARB://network_common for shared network facts.
common:
  tags: arbiter reasoning firewall security network iot
  harness: console
  platform_allow: native_sim
