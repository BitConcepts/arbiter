arb_version: 0.1
model: solar_mppt_tracker

target:
  rtos: zephyr
  profile: static_c

system:
  item: solar_charge_controller
  safety_context: energy_management

facts:
  # --- Panel inputs ---
  - id: pv.voltage_mv
    type: uint32
    unit: mV
    range: [0, 60000]
    source: adc
    stale_after_ms: 100

  - id: pv.current_ma
    type: uint32
    unit: mA
    range: [0, 20000]
    source: current_sense
    stale_after_ms: 100

  - id: pv.prev_voltage_mv
    type: uint32
    source: computed

  - id: pv.prev_power_mw
    type: uint32
    source: computed

  # --- Battery ---
  - id: bat.voltage_mv
    type: uint32
    unit: mV
    range: [0, 60000]
    source: adc
    stale_after_ms: 500

  - id: bat.soc_pct
    type: uint32
    range: [0, 100]
    source: fuel_gauge

  - id: bat.temp_c
    type: int32
    unit: celsius_x10
    range: [-200, 600]
    source: ntc

  # --- Computed by MPPT engine ---
  - id: mppt.power_mw
    type: uint32
    source: computed
    description: "Current panel power (V*I/1000)"

  - id: mppt.delta_power
    type: int32
    source: computed
    description: "Power change from last step"

  - id: mppt.delta_voltage
    type: int32
    source: computed

  - id: mppt.duty_pct_x10
    type: uint32
    range: [0, 1000]
    source: computed
    description: "PWM duty cycle x10 (0-1000 = 0-100.0%)"

  - id: mppt.step_size
    type: uint32
    range: [1, 50]
    default: 10
    description: "Perturb step size for duty cycle (x10)"

  - id: mppt.direction
    type: int32
    default: 1
    source: computed
    description: "+1 = increase duty, -1 = decrease"

modes:
  - id: mode.startup
  - id: mode.tracking
  - id: mode.float_charge
  - id: mode.absorb_charge
  - id: mode.overtemp
  - id: mode.night

rules:
  # ====== NIGHT DETECTION ======
  - id: "01_night"
    class: mode_guard
    when:
      all:
        - fact: pv.voltage_mv
          op: "<"
          value: 5000
    then:
      set_mode: mode.night
      compute:
        - target: mppt.duty_pct_x10
          op: assign
          left_literal: 0
      explanation: "Panel voltage < 5V — night mode, disable converter."

  # ====== BATTERY OVERTEMP ======
  - id: "02_overtemp"
    class: safety_guard
    when:
      all:
        - fact: bat.temp_c
          op: ">"
          value: 500
    then:
      set_mode: mode.overtemp
      compute:
        - target: mppt.duty_pct_x10
          op: assign
          left_literal: 0
      action: disable_charger
      explanation: "Battery > 50°C — stop charging."
      criticality: safety_critical

  # ====== FLOAT CHARGE (battery full) ======
  - id: "05_float"
    class: mode_guard
    when:
      all:
        - fact: bat.soc_pct
          op: ">="
          value: 95
        - fact: bat.voltage_mv
          op: ">="
          value: 28400
    then:
      set_mode: mode.float_charge
      compute:
        # Reduce duty to maintain float voltage
        - target: mppt.duty_pct_x10
          op: clamp
          left: mppt.duty_pct_x10
          right_literal: 0
          scale: 300
      explanation: "Battery >= 95% SoC — float charge mode."

  # ====== P&O MPPT ALGORITHM ======
  - id: "10_mppt.compute_power"
    class: inference
    when:
      all:
        - fact: pv.voltage_mv
          op: ">="
          value: 5000
        - fact: bat.soc_pct
          op: "<"
          value: 95
    then:
      set_mode: mode.tracking
      compute:
        # Save previous values
        - target: pv.prev_voltage_mv
          op: assign
          left: pv.voltage_mv
        - target: pv.prev_power_mw
          op: assign
          left: mppt.power_mw

        # power = (voltage * current) / 1000
        - target: mppt.power_mw
          op: scale
          left: pv.voltage_mv
          right: pv.current_ma
          scale: 1000

        # delta_power = power - prev_power
        - target: mppt.delta_power
          op: sub
          left: mppt.power_mw
          right: pv.prev_power_mw

        # delta_voltage = voltage - prev_voltage
        - target: mppt.delta_voltage
          op: sub
          left: pv.voltage_mv
          right: pv.prev_voltage_mv
      explanation: "Compute panel power and deltas for P&O."

  # ====== P&O DIRECTION DECISION ======
  - id: "20_mppt.power_increased"
    class: inference
    when:
      all:
        - fact: mppt.delta_power
          op: ">"
          value: 0
    then:
      compute:
        # Power increased — keep same direction (do nothing to direction)
        - target: mppt.direction
          op: assign
          left: mppt.direction
      explanation: "Power increased — continue same direction."

  - id: "21_mppt.power_decreased"
    class: inference
    when:
      all:
        - fact: mppt.delta_power
          op: "<"
          value: 0
    then:
      compute:
        # Power decreased — reverse direction
        - target: mppt.direction
          op: negate
          left: mppt.direction
      explanation: "Power decreased — reverse perturb direction."

  # ====== APPLY STEP ======
  - id: "30_mppt.step_up"
    class: inference
    when:
      all:
        - fact: mppt.direction
          op: "=="
          value: 1
        - fact: pv.voltage_mv
          op: ">="
          value: 5000
    then:
      compute:
        - target: mppt.duty_pct_x10
          op: add
          left: mppt.duty_pct_x10
          right: mppt.step_size
        - target: mppt.duty_pct_x10
          op: clamp
          left: mppt.duty_pct_x10
          right_literal: 0
          scale: 950

  - id: "31_mppt.step_down"
    class: inference
    when:
      all:
        - fact: mppt.direction
          op: "=="
          value: -1
        - fact: pv.voltage_mv
          op: ">="
          value: 5000
    then:
      compute:
        - target: mppt.duty_pct_x10
          op: sub
          left: mppt.duty_pct_x10
          right: mppt.step_size
        - target: mppt.duty_pct_x10
          op: clamp
          left: mppt.duty_pct_x10
          right_literal: 0
          scale: 950

  # ====== ACTUATE ======
  - id: "40_actuate"
    class: obligation
    when:
      all:
        - fact: pv.voltage_mv
          op: ">="
          value: 5000
    then:
      action: set_pwm_duty
      explanation: "Apply computed duty cycle to converter PWM."

actions:
  - id: disable_charger
    type: callback
    symbol: app_disable_charger
    safe_state_action: true

  - id: set_pwm_duty
    type: callback
    symbol: app_set_pwm_duty
