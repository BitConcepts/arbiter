sample:
  name: arbiter Fault Diagnosis Solver
  description: >
    Root-cause fault diagnosis using weighted evidence accumulation.
    Maps observed symptom flags to candidate causes with confidence
    scoring.  Demonstrates a motor-drive diagnostic solver with
    6 symptom inputs and 4 candidate diagnoses.
common:
  tags: arbiter solver diagnostics fault-tree motor-drive
  harness: console
  platform_allow: native_sim
tests:
  sample.arbiter.fault-diagnosis:
    tags: arbiter sample solver
    platform_allow: native_sim
    harness: console
    build_only: true

