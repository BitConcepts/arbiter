sample:
  name: arbiter PID Engine
  description: >
    arbiter IS the PID controller. The compute engine calculates error,
    P/I/D terms, output summing, clamping, and anti-windup — all in
    ARB rules with fixed-point arithmetic. The application only feeds
    setpoint + sensor values and provides an actuator callback.
common:
  tags: arbiter reasoning compute pid engine motion-control
  platform_allow: native_sim
tests:
  sample.arbiter.pid-controller:
    tags: arbiter sample
    platform_allow: native_sim
    build_only: true

