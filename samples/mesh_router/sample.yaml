sample:
  name: arbiter Mesh Network Router
  description: >
    Thread/OpenThread-inspired mesh routing reasoning engine. arbiter
    computes link margin, parent quality scores, and congestion levels,
    then reasons about parent selection, TX power, rate limiting, and
    power management. Demonstrates compute + reasoning, not just policy.
common:
  tags: arbiter reasoning compute mesh thread openthread routing
  harness: console
  platform_allow: native_sim
tests:
  sample.arbiter.mesh-router:
    tags: arbiter sample
    platform_allow: native_sim
    harness: console
    build_only: true

