sample:
  name: arbiter Valve Sequencer
  description: >
    Multi-step batch process sequencer. arbiter reasons through
    fill -> reagent -> react -> drain -> vent, managing step state
    as a derived fact and enforcing safety interlocks (overpressure,
    overtemp, operator abort) at every step.
common:
  tags: arbiter reasoning sequencer valve process-control batch
  platform_allow: native_sim
tests:
  sample.arbiter.valve-sequencer:
    tags: arbiter sample
    platform_allow: native_sim
    build_only: true

