arb_version: 0.1
model: valve_sequencer

target:
  rtos: zephyr
  profile: static_c

system:
  item: chemical_batch_reactor
  safety_context: process_control

facts:
  # --- Process inputs ---
  - id: proc.start_cmd
    type: bool
    source: hmi

  - id: proc.abort_cmd
    type: bool
    source: hmi

  - id: proc.step
    type: uint32
    range: [0, 10]
    source: computed
    description: "Current sequence step (0=idle, 1..N=active steps)"

  - id: proc.step_timer_ms
    type: uint32
    range: [0, 600000]
    source: computed
    description: "Time elapsed in current step"

  # --- Valve positions (feedback) ---
  - id: valve.inlet
    type: bool
    source: limit_switch

  - id: valve.outlet
    type: bool
    source: limit_switch

  - id: valve.vent
    type: bool
    source: limit_switch

  - id: valve.reagent
    type: bool
    source: limit_switch

  # --- Sensors ---
  - id: sensor.level_pct
    type: uint32
    unit: percent
    range: [0, 100]
    source: level_sensor
    stale_after_ms: 2000
    safety_relevant: true

  - id: sensor.pressure_kpa
    type: uint32
    unit: kpa_x10
    range: [0, 20000]
    source: pressure_transducer
    stale_after_ms: 1000
    safety_relevant: true

  - id: sensor.temp_c
    type: int32
    unit: celsius_x10
    range: [-500, 3000]
    source: thermocouple
    stale_after_ms: 5000
    safety_relevant: true

  # --- Computed ---
  - id: calc.fill_complete
    type: bool
    source: computed

  - id: calc.reaction_complete
    type: bool
    source: computed

  - id: calc.drain_complete
    type: bool
    source: computed

modes:
  - id: mode.idle
  - id: mode.fill
  - id: mode.add_reagent
  - id: mode.react
  - id: mode.drain
  - id: mode.vent
  - id: mode.complete
  - id: mode.overpressure
  - id: mode.overtemp
  - id: mode.abort

rules:
  # ====== SAFETY (always first) ======

  - id: "01_safety.overpressure"
    class: safety_guard
    when:
      all:
        - fact: sensor.pressure_kpa
          op: ">"
          value: 15000
    then:
      set_mode: mode.overpressure
      compute:
        - target: proc.step
          op: assign
          left_literal: 0
      action: emergency_vent
      explanation: "Pressure > 1500 kPa — emergency vent."
      criticality: safety_critical

  - id: "02_safety.overtemp"
    class: safety_guard
    when:
      all:
        - fact: sensor.temp_c
          op: ">"
          value: 2000
    then:
      set_mode: mode.overtemp
      compute:
        - target: proc.step
          op: assign
          left_literal: 0
      action: emergency_cool
      explanation: "Temperature > 200°C — emergency cooling."
      criticality: safety_critical

  - id: "03_safety.abort"
    class: safety_guard
    when:
      all:
        - fact: proc.abort_cmd
          op: "=="
          value: true
    then:
      set_mode: mode.abort
      compute:
        - target: proc.step
          op: assign
          left_literal: 0
      action: close_all_valves
      explanation: "Operator abort — close all valves."
      criticality: safety_critical

  # ====== SEQUENCE REASONING ======

  - id: "10_seq.start"
    class: inference
    when:
      all:
        - fact: proc.start_cmd
          op: "=="
          value: true
        - fact: proc.step
          op: "=="
          value: 0
        - fact: proc.abort_cmd
          op: "=="
          value: false
    then:
      set_mode: mode.fill
      compute:
        - target: proc.step
          op: assign
          left_literal: 1
        - target: proc.step_timer_ms
          op: assign
          left_literal: 0
      action: open_inlet
      explanation: "Sequence started — open inlet valve, begin fill."

  - id: "11_seq.fill_check"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 1
        - fact: sensor.level_pct
          op: ">="
          value: 80
    then:
      compute:
        - target: calc.fill_complete
          op: assign
          left_literal: 1
      explanation: "Fill reached 80% — ready for reagent."

  - id: "12_seq.add_reagent"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 1
        - fact: calc.fill_complete
          op: "=="
          value: true
    then:
      set_mode: mode.add_reagent
      compute:
        - target: proc.step
          op: assign
          left_literal: 2
        - target: proc.step_timer_ms
          op: assign
          left_literal: 0
      action: close_inlet_open_reagent
      explanation: "Close inlet, open reagent valve."

  - id: "13_seq.react"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 2
        - fact: sensor.level_pct
          op: ">="
          value: 90
    then:
      set_mode: mode.react
      compute:
        - target: proc.step
          op: assign
          left_literal: 3
        - target: proc.step_timer_ms
          op: assign
          left_literal: 0
      action: close_reagent
      explanation: "Reagent added — begin reaction hold."

  - id: "14_seq.reaction_timer"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 3
        - fact: proc.step_timer_ms
          op: ">"
          value: 30000
    then:
      compute:
        - target: calc.reaction_complete
          op: assign
          left_literal: 1
      explanation: "Reaction hold > 30s — reaction complete."

  - id: "15_seq.drain"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 3
        - fact: calc.reaction_complete
          op: "=="
          value: true
    then:
      set_mode: mode.drain
      compute:
        - target: proc.step
          op: assign
          left_literal: 4
      action: open_outlet
      explanation: "Begin drain — open outlet valve."

  - id: "16_seq.drain_check"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 4
        - fact: sensor.level_pct
          op: "<="
          value: 5
    then:
      set_mode: mode.vent
      compute:
        - target: proc.step
          op: assign
          left_literal: 5
      action: close_outlet_open_vent
      explanation: "Drained — close outlet, open vent."

  - id: "17_seq.complete"
    class: inference
    when:
      all:
        - fact: proc.step
          op: "=="
          value: 5
        - fact: sensor.pressure_kpa
          op: "<"
          value: 1100
    then:
      set_mode: mode.complete
      compute:
        - target: proc.step
          op: assign
          left_literal: 0
      action: close_all_valves
      explanation: "Pressure vented — sequence complete."

actions:
  - id: emergency_vent
    type: callback
    symbol: app_emergency_vent
    must_complete_within_ms: 10
    safe_state_action: true

  - id: emergency_cool
    type: callback
    symbol: app_emergency_cool
    must_complete_within_ms: 50
    safe_state_action: true

  - id: close_all_valves
    type: callback
    symbol: app_close_all_valves
    safe_state_action: true

  - id: open_inlet
    type: callback
    symbol: app_open_inlet

  - id: close_inlet_open_reagent
    type: callback
    symbol: app_close_inlet_open_reagent

  - id: close_reagent
    type: callback
    symbol: app_close_reagent

  - id: open_outlet
    type: callback
    symbol: app_open_outlet

  - id: close_outlet_open_vent
    type: callback
    symbol: app_close_outlet_open_vent
