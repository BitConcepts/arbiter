sample:
  name: arbiter Task Scheduler Solver
  description: >
    Priority-and-deadline-aware task scheduler implemented as a ARB
    reasoning model.  Computes urgency scores combining static priority
    with deadline proximity, selects the best ready task, and detects
    deadline misses — demonstrating embedded scheduling as a solver.
common:
  tags: arbiter solver scheduler deadline priority real-time
  platform_allow: native_sim
tests:
  sample.arbiter.task-scheduler:
    tags: arbiter sample solver
    platform_allow: native_sim
    build_only: true

