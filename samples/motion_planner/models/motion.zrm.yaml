zrm_version: 0.1
model: motion_planner
target:
  rtos: zephyr
  profile: static_c

system:
  item: waypoint_steering
  safety_context: motion_control

# Waypoint trajectory planner with obstacle avoidance.
# Computes steering correction from current heading, target bearing,
# and obstacle proximity.  All angles in millidegrees, distances in mm.
#
# Steering = heading_error * gain - obstacle_repulsion
# The engine clamps output and triggers emergency stop if an obstacle
# is too close.

facts:
  # --- Position/heading inputs ---
  - id: in.pos_x
    type: int32
    unit: mm
    source: odometry
  - id: in.pos_y
    type: int32
    unit: mm
    source: odometry
  - id: in.heading
    type: int32
    unit: millideg
    range: [0, 360000]
    source: imu
    stale_after_ms: 50
    safety_relevant: true

  - id: in.sensor_valid
    type: bool
    source: diagnostics
    safety_relevant: true

  - id: in.enable
    type: bool
    source: command

  # --- Target waypoint ---
  - id: wp.x
    type: int32
    unit: mm
    source: command
  - id: wp.y
    type: int32
    unit: mm
    source: command

  # --- Obstacle sensor (nearest obstacle) ---
  - id: obs.distance
    type: int32
    unit: mm
    range: [0, 100000]
    source: lidar
    safety_relevant: true
  - id: obs.bearing
    type: int32
    unit: millideg
    range: [0, 360000]
    source: lidar

  # --- Tunable gains ---
  - id: gain.steer
    type: int32
    range: [0, 10000]
    default: 500
  - id: gain.repulse
    type: int32
    range: [0, 10000]
    default: 800
  - id: param.stop_dist
    type: int32
    unit: mm
    default: 200
    range: [50, 5000]

  # --- Computed ---
  - id: nav.dx
    type: int32
    source: computed
  - id: nav.dy
    type: int32
    source: computed
  - id: nav.distance
    type: int32
    unit: mm
    source: computed
  - id: nav.heading_error
    type: int32
    unit: millideg
    source: computed
  - id: nav.steer_cmd
    type: int32
    source: computed
  - id: nav.repulsion
    type: int32
    source: computed
  - id: nav.output
    type: int32
    range: [-1000, 1000]
    unit: permille
    source: computed
    safety_relevant: true
  - id: nav.speed_pct
    type: int32
    range: [0, 100]
    source: computed

modes:
  - id: mode.idle
  - id: mode.navigating
  - id: mode.obstacle_close
  - id: mode.estop
  - id: mode.arrived
  - id: mode.sensor_fault

rules:
  # ===== FAULT =====
  - id: "01_fault"
    class: safety_guard
    when:
      any:
        - fact: in.sensor_valid
          op: "=="
          value: false
        - fact: in.heading
          op: stale
          value: 50
    then:
      set_mode: mode.sensor_fault
      compute:
        - target: nav.output
          op: assign
          left_literal: 0
        - target: nav.speed_pct
          op: assign
          left_literal: 0
      action: halt_motors
      explanation: "Sensor fault — halt."
      criticality: safety_critical

  # ===== EMERGENCY STOP =====
  - id: "02_estop"
    class: safety_guard
    when:
      all:
        - fact: obs.distance
          op: "<"
          value: 200
        - fact: in.enable
          op: "=="
          value: true
    then:
      set_mode: mode.estop
      compute:
        - target: nav.output
          op: assign
          left_literal: 0
        - target: nav.speed_pct
          op: assign
          left_literal: 0
      action: halt_motors
      explanation: "Obstacle within stop distance — emergency stop."
      criticality: safety_critical

  - id: "03_idle"
    class: mode_guard
    when:
      all:
        - fact: in.enable
          op: "=="
          value: false
    then:
      set_mode: mode.idle

  # ===== COMPUTE DELTA TO WAYPOINT =====
  - id: "10_delta"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: in.sensor_valid
          op: "=="
          value: true
        - fact: obs.distance
          op: ">="
          value: 200
    then:
      set_mode: mode.navigating
      compute:
        - target: nav.dx
          op: sub
          left: wp.x
          right: in.pos_x
        - target: nav.dy
          op: sub
          left: wp.y
          right: in.pos_y

        # Approximate distance = |dx| + |dy|  (Manhattan, good enough)
        - target: nav.distance
          op: abs
          left: nav.dx
        - target: nav.distance
          op: add
          left: nav.distance
          right: nav.dy
      explanation: "Compute vector to waypoint."

  # ===== ARRIVED CHECK =====
  - id: "15_arrived"
    class: mode_guard
    when:
      all:
        - fact: nav.distance
          op: "<"
          value: 100
        - fact: in.enable
          op: "=="
          value: true
    then:
      set_mode: mode.arrived
      compute:
        - target: nav.output
          op: assign
          left_literal: 0
        - target: nav.speed_pct
          op: assign
          left_literal: 0
      action: waypoint_reached

  # ===== STEERING COMPUTATION =====
  - id: "20_steer"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: nav.distance
          op: ">="
          value: 100
        - fact: in.sensor_valid
          op: "=="
          value: true
    then:
      compute:
        # Simplified heading error proxy: dx sign scaled
        # (full atan2 not available, so we use dx as steering proxy)
        - target: nav.heading_error
          op: assign
          left: nav.dx

        # steer_cmd = (heading_error * gain.steer) / 1000
        - target: nav.steer_cmd
          op: scale
          left: nav.heading_error
          right: gain.steer
          scale: 1000

  # ===== OBSTACLE REPULSION =====
  - id: "25_repulse"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: obs.distance
          op: "<"
          value: 2000
        - fact: obs.distance
          op: ">="
          value: 200
    then:
      set_mode: mode.obstacle_close
      compute:
        # repulsion = gain.repulse * (2000 - distance) / 2000
        - target: nav.repulsion
          op: sub
          left_literal: 2000
          right: obs.distance
        - target: nav.repulsion
          op: scale
          left: nav.repulsion
          right: gain.repulse
          scale: 2000
      explanation: "Obstacle nearby — apply repulsion."

  # ===== COMBINE OUTPUT =====
  - id: "30_output"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: nav.distance
          op: ">="
          value: 100
    then:
      compute:
        - target: nav.output
          op: sub
          left: nav.steer_cmd
          right: nav.repulsion
        - target: nav.output
          op: clamp
          left: nav.output
          right_literal: -1000
          scale: 1000

        # Speed proportional to distance, capped at 100
        - target: nav.speed_pct
          op: div
          left: nav.distance
          right_literal: 100
        - target: nav.speed_pct
          op: clamp
          left: nav.speed_pct
          right_literal: 0
          scale: 100

  # ===== ACTUATE =====
  - id: "40_actuate"
    class: obligation
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
    then:
      action: update_motors
      explanation: "Send steering and speed to motors."

actions:
  - id: update_motors
    type: callback
    symbol: app_update_motors

  - id: halt_motors
    type: callback
    symbol: app_halt_motors

  - id: waypoint_reached
    type: callback
    symbol: app_waypoint_reached
