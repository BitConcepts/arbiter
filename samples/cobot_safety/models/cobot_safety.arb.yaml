arb_version: 0.1
model: cobot_safety_controller

imports:
  - ARB://estop
  - ARB://safety_common

target:
  rtos: zephyr
  profile: static_c
  safety_profile: zrm_safety_strict_v0

system:
  item: collaborative_robot_safety
  safety_context: iso_10218_iso_ts_15066

facts:
  - id: robot.tcp_speed_mms
    type: uint32
    unit: mm_per_sec
    range: [0, 5000]
    source: kinematics
    stale_after_ms: 10
    safety_relevant: true
    description: "Tool center point speed"

  - id: robot.joint_torque_max_pct
    type: uint32
    range: [0, 200]
    source: motor_driver
    stale_after_ms: 20
    safety_relevant: true
    description: "Highest joint torque as % of rated"

  - id: robot.payload_kg_x10
    type: uint32
    range: [0, 500]
    source: load_cell
    description: "Payload weight x10 (e.g. 35 = 3.5 kg)"

  - id: robot.zone
    type: enum
    source: safety_plc
    safety_relevant: true
    description: "0=unknown, 1=free, 2=reduced, 3=collaborative, 4=stop"

  - id: human.detected
    type: bool
    source: lidar_scanner
    safety_relevant: true

  - id: human.distance_mm
    type: uint32
    range: [0, 10000]
    source: lidar_scanner
    stale_after_ms: 50
    safety_relevant: true

  - id: robot.enabled
    type: bool
    source: plc

  # --- Computed ---
  - id: calc.speed_limit_mms
    type: uint32
    range: [0, 5000]
    source: computed
    safety_relevant: true
    description: "Dynamic speed limit based on zone and proximity"

  - id: calc.force_limit_pct
    type: uint32
    range: [0, 100]
    source: computed

  - id: calc.speed_ok
    type: bool
    source: computed

modes:
  - id: mode.full_speed
  - id: mode.reduced_speed
  - id: mode.collaborative
  - id: mode.protective_stop
  - id: mode.estop

hazards:
  - id: haz.collision
    severity: catastrophic
    description: "Robot collides with human operator."
  - id: haz.crush
    severity: catastrophic
    description: "Robot traps operator against fixed object."

safety_goals:
  - id: sg.prevent_collision
    hazard: haz.collision
    integrity_target: SIL_2_ready
    safe_state: mode.protective_stop

rules:
  # ====== ZONE-BASED SPEED LIMITS ======
  - id: "01_zone.free"
    class: inference
    when:
      all:
        - fact: robot.zone
          op: "=="
          value: 1
        - fact: human.detected
          op: "=="
          value: false
    then:
      set_mode: mode.full_speed
      compute:
        - target: calc.speed_limit_mms
          op: assign
          left_literal: 2000
        - target: calc.force_limit_pct
          op: assign
          left_literal: 100
      explanation: "Free zone, no human — full speed (2000 mm/s)."

  - id: "02_zone.reduced"
    class: mode_guard
    when:
      all:
        - fact: robot.zone
          op: "=="
          value: 2
    then:
      set_mode: mode.reduced_speed
      compute:
        - target: calc.speed_limit_mms
          op: assign
          left_literal: 500
        - target: calc.force_limit_pct
          op: assign
          left_literal: 60
      explanation: "Reduced speed zone — 500 mm/s max."

  - id: "03_zone.collaborative"
    class: mode_guard
    when:
      any:
        - fact: robot.zone
          op: "=="
          value: 3
        - fact: human.detected
          op: "=="
          value: true
    then:
      set_mode: mode.collaborative
      compute:
        - target: calc.speed_limit_mms
          op: assign
          left_literal: 250
        - target: calc.force_limit_pct
          op: assign
          left_literal: 30
      explanation: "Collaborative zone or human detected — 250 mm/s, 30% force."

  # ====== PROXIMITY-BASED DYNAMIC LIMITING ======
  - id: "10_proximity.close"
    class: safety_guard
    safety_goal: sg.prevent_collision
    when:
      all:
        - fact: human.detected
          op: "=="
          value: true
        - fact: human.distance_mm
          op: "<"
          value: 500
    then:
      set_mode: mode.protective_stop
      compute:
        - target: calc.speed_limit_mms
          op: assign
          left_literal: 0
      action: protective_stop
      explanation: "Human < 500mm — protective stop."
      criticality: safety_critical

  - id: "11_proximity.near"
    class: mode_guard
    when:
      all:
        - fact: human.detected
          op: "=="
          value: true
        - fact: human.distance_mm
          op: "<"
          value: 1000
        - fact: human.distance_mm
          op: ">="
          value: 500
    then:
      compute:
        # Scale speed with distance: limit = distance_mm / 4
        - target: calc.speed_limit_mms
          op: div
          left: human.distance_mm
          right_literal: 4
      explanation: "Human 500-1000mm — speed proportional to distance."

  # ====== SPEED/FORCE VIOLATION ======
  - id: "20_overspeed"
    class: safety_guard
    safety_goal: sg.prevent_collision
    when:
      all:
        - fact: robot.tcp_speed_mms
          op: ">"
          value: 250
        - fact: human.detected
          op: "=="
          value: true
    then:
      set_mode: mode.protective_stop
      action: protective_stop
      explanation: "TCP speed > limit while human present — stop."
      criticality: safety_critical

  - id: "21_overtorque"
    class: safety_guard
    when:
      all:
        - fact: robot.joint_torque_max_pct
          op: ">"
          value: 80
        - fact: human.detected
          op: "=="
          value: true
    then:
      set_mode: mode.protective_stop
      action: protective_stop
      explanation: "Joint torque > 80% rated during collaboration — stop."
      criticality: safety_critical

  # ====== ZONE STOP ======
  - id: "30_zone.stop"
    class: safety_guard
    when:
      all:
        - fact: robot.zone
          op: "=="
          value: 4
    then:
      set_mode: mode.protective_stop
      action: protective_stop
      explanation: "Safety zone = STOP."
      criticality: safety_critical

actions:
  - id: protective_stop
    type: callback
    symbol: app_protective_stop
    must_complete_within_ms: 10
    safe_state_action: true
