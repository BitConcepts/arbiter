zrm_version: 0.1
model: kalman_filter
target:
  rtos: zephyr
  profile: static_c

system:
  item: sensor_fusion_filter
  safety_context: navigation

# 1-D Kalman filter for fusing a noisy sensor measurement with a
# predicted state estimate.  All values fixed-point x1000.
#
# Predict step:
#   x_pred  = x_est                          (no control input)
#   p_pred  = p_est + q
# Update step:
#   k_gain  = p_pred / (p_pred + r)          (Kalman gain, x1000)
#   x_est   = x_pred + k_gain * (z - x_pred) / 1000
#   p_est   = (1000 - k_gain) * p_pred / 1000

includes:
  - lib/zrm/sensor_health.zrm.yaml

facts:
  # --- Inputs ---
  - id: in.measurement
    type: int32
    unit: milli_unit
    range: [-500000, 500000]
    source: sensor
    stale_after_ms: 100
    safety_relevant: true

  - id: in.sensor_valid
    type: bool
    source: diagnostics
    safety_relevant: true

  - id: in.enable
    type: bool
    source: command

  # --- Tunable noise parameters ---
  - id: param.q
    type: int32
    range: [1, 100000]
    default: 100
    unit: variance_x1000

  - id: param.r
    type: int32
    range: [1, 500000]
    default: 5000
    unit: variance_x1000

  # --- State (computed) ---
  - id: kf.x_est
    type: int32
    source: computed

  - id: kf.x_pred
    type: int32
    source: computed

  - id: kf.p_est
    type: int32
    source: computed
    default: 10000

  - id: kf.p_pred
    type: int32
    source: computed

  - id: kf.k_gain
    type: int32
    range: [0, 1000]
    source: computed

  - id: kf.innovation
    type: int32
    source: computed

  - id: kf.correction
    type: int32
    source: computed

  - id: kf.p_factor
    type: int32
    source: computed

  - id: kf.denom
    type: int32
    source: computed

modes:
  - id: mode.idle
  - id: mode.running
  - id: mode.sensor_fault

rules:
  # ===== FAULT GUARD =====
  - id: "01_fault.sensor"
    class: safety_guard
    when:
      any:
        - fact: in.sensor_valid
          op: "=="
          value: false
        - fact: in.measurement
          op: stale
          value: 100
    then:
      set_mode: mode.sensor_fault
      explanation: "Sensor fault — hold last estimate."
      criticality: safety_critical

  - id: "02_check.disabled"
    class: mode_guard
    when:
      all:
        - fact: in.enable
          op: "=="
          value: false
    then:
      set_mode: mode.idle

  # ===== PREDICT STEP =====
  - id: "10_predict"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: in.sensor_valid
          op: "=="
          value: true
    then:
      set_mode: mode.running
      compute:
        # x_pred = x_est  (state propagation, no control)
        - target: kf.x_pred
          op: assign
          left: kf.x_est

        # p_pred = p_est + q
        - target: kf.p_pred
          op: add
          left: kf.p_est
          right: param.q
      explanation: "Predict: propagate state and covariance."

  # ===== UPDATE STEP (GAIN) =====
  - id: "20_update.gain"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: in.sensor_valid
          op: "=="
          value: true
    then:
      compute:
        # denom = p_pred + r
        - target: kf.denom
          op: add
          left: kf.p_pred
          right: param.r

        # k_gain = (p_pred * 1000) / denom
        - target: kf.k_gain
          op: scale
          left: kf.p_pred
          right_literal: 1000
          scale: 1

        - target: kf.k_gain
          op: div
          left: kf.k_gain
          right: kf.denom
      explanation: "Update: compute Kalman gain."

  # ===== UPDATE STEP (STATE + COVARIANCE) =====
  - id: "30_update.state"
    class: inference
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
        - fact: in.sensor_valid
          op: "=="
          value: true
    then:
      compute:
        # innovation = measurement - x_pred
        - target: kf.innovation
          op: sub
          left: in.measurement
          right: kf.x_pred

        # correction = (k_gain * innovation) / 1000
        - target: kf.correction
          op: scale
          left: kf.k_gain
          right: kf.innovation
          scale: 1000

        # x_est = x_pred + correction
        - target: kf.x_est
          op: add
          left: kf.x_pred
          right: kf.correction

        # p_factor = 1000 - k_gain
        - target: kf.p_factor
          op: sub
          left_literal: 1000
          right: kf.k_gain

        # p_est = (p_factor * p_pred) / 1000
        - target: kf.p_est
          op: scale
          left: kf.p_factor
          right: kf.p_pred
          scale: 1000
      explanation: "Update: correct state estimate and covariance."

  # ===== OUTPUT =====
  - id: "40_output"
    class: obligation
    when:
      all:
        - fact: in.enable
          op: "=="
          value: true
    then:
      action: publish_estimate
      explanation: "Publish filtered estimate."

actions:
  - id: publish_estimate
    type: callback
    symbol: app_publish_estimate
