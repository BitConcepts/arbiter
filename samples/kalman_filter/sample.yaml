sample:
  name: arbiter Kalman Filter Solver
  description: >
    A 1-D Kalman filter implemented entirely in ARB compute expressions.
    Demonstrates predict/update cycle with fixed-point Kalman gain
    calculation, covariance tracking, and sensor fusion — a common
    numerical solver pattern for embedded navigation and estimation.
common:
  tags: arbiter solver kalman filter estimation sensor-fusion
  harness: console
  platform_allow: native_sim
tests:
  sample.arbiter.kalman-filter:
    tags: arbiter sample solver
    platform_allow: native_sim
    harness: console
    build_only: true

