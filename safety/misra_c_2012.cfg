# MISRA C:2012 Configuration for Arbiter Engine
# Use with: cppcheck --addon=misra --suppressions-list=safety/misra_suppressions.txt
#
# Scope: lib/*.c, subsys/arbiter/*.c, include/arbiter/*.h
# Standard: MISRA C:2012 with Amendment 1 and Amendment 2
#
# This configuration targets SIL 4 / ASIL D compliance.
# All mandatory rules must pass. Advisory rules should pass
# with documented deviations where necessary.

# Required rules (must comply)
# Rule 1.3: No undefined or critical unspecified behavior
# Rule 8.13: Pointer params should be const if not modified
# Rule 10.1-10.8: Essential type model (integer promotions)
# Rule 11.1-11.9: Pointer conversions
# Rule 12.1-12.4: Expression evaluation
# Rule 13.1-13.6: Side effects
# Rule 14.1-14.4: Control flow
# Rule 15.1-15.7: Switch statements
# Rule 17.1-17.2: No stdarg, no recursion
# Rule 18.1-18.8: Pointer arithmetic
# Rule 19.1-19.2: Overlapping objects
# Rule 20.1-20.14: Preprocessing directives
# Rule 21.1-21.21: Standard library restrictions

# Key rules already compliant by design:
# Rule 17.2: No recursion — engine has no recursive calls
# Rule 21.3: No malloc/realloc/free — engine uses no heap
# Rule 21.4: No setjmp/longjmp — not used
# Rule 21.5: No signal.h — not used
# Rule 21.7: No atof/atoi — not used
# Rule 21.8: No abort/exit/system — not used
# Rule 21.10: No time.h in engine — not used
