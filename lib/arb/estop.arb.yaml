# SPDX-License-Identifier: MIT
# ARB://estop — Reusable emergency stop pattern

arb_version: 0.1
model: _include_estop

facts:
  - id: estop.channel_a
    type: bool
    source: safety_relay
    safety_relevant: true
    description: "E-stop channel A (dual-channel pattern)"

  - id: estop.channel_b
    type: bool
    source: safety_relay
    safety_relevant: true
    description: "E-stop channel B"

  - id: estop.active
    type: bool
    source: computed
    safety_relevant: true
    description: "True if either channel is active"

rules:
  - id: inc.estop_either_channel
    class: safety_guard
    when:
      any:
        - fact: estop.channel_a
          op: "=="
          value: true
        - fact: estop.channel_b
          op: "=="
          value: true
    then:
      compute:
        - target: estop.active
          op: assign
          left_literal: 1
      action: inc_estop_activate
      explanation: "E-stop activated (dual-channel, either triggers)."
      criticality: safety_critical

  - id: inc.estop_discrepancy
    class: safety_guard
    when:
      all:
        - fact: estop.channel_a
          op: "!="
          value: false
    then:
      # Channels should agree — discrepancy is a diagnostic concern
      # but single-channel activation still triggers safe state above
      explanation: "E-stop channel discrepancy check."

actions:
  - id: inc_estop_activate
    type: callback
    symbol: app_estop_safe_state
    must_complete_within_ms: 10
    safe_state_action: true
