name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check python/

      - name: Type check with mypy
        run: mypy python/zproj/

      - name: Run tests
        run: pytest tests/python -v

      - name: Validate sample model
        run: zprojc validate samples/battery_policy/models/battery.zrm.yaml --strict

  spdx:
    name: SPDX Header Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers
        run: |
          missing=0
          for f in $(find lib/ include/ subsys/ python/ -name '*.c' -o -name '*.h' -o -name '*.py' | grep -v __pycache__); do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "Missing SPDX header: $f"
              missing=1
            fi
          done
          exit $missing

