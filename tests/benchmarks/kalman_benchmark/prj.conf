CONFIG_ARBITER=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
# Run simulation tied to real host time so benchmark timing is meaningful.
# Without this, native_sim's simulated clock doesn't advance during
# CPU-bound loops and all timing reads return 0.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
